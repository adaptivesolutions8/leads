<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Leads SHN & PAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2430; --muted:#5E6876; --line:#DCE1E7; --paper:#F2F4F7; --card:#FFFFFF;
  --navy:#22406B; --navy-2:#2D5690;
  --belum:#D1921A; --spk:#1C837D; --do:#2F5DA8; --tidak:#858C97; --batal:#B4423A;
  --warn:#B4423A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}

/* ---------- header ---------- */
.top{background:var(--navy);color:#fff;padding:16px 20px 18px}
.top-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.brand{margin-right:auto}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:13px;color:#C9D5E6}
.search{position:relative;flex:0 1 300px}
.search input{width:100%;height:38px;border:0;border-radius:6px;padding:0 12px 0 34px;
  background:rgba(255,255,255,.14);color:#fff}
.search input::placeholder{color:#C9D5E6}
.search input:focus{background:#fff;color:var(--ink)}
.search svg{position:absolute;left:10px;top:11px;width:16px;height:16px;opacity:.75}
.btn{height:38px;border-radius:6px;border:1px solid transparent;padding:0 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.btn-primary{background:#fff;color:var(--navy)}
.btn-primary:hover{background:#E8EEF7}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn svg{width:16px;height:16px}

/* ---------- perusahaan & brand ---------- */
.cmp{max-width:1280px;margin:14px auto 0;display:flex;gap:4px;flex-wrap:wrap}
.ct{border:0;cursor:pointer;background:transparent;color:#C9D5E6;padding:7px 12px;border-radius:6px;
  display:flex;align-items:baseline;gap:8px;text-align:left}
.ct b{color:#fff;font-weight:600}
.ct small{font-size:12px}
.ct:hover{background:rgba(255,255,255,.08)}
.ct.on{background:#fff;color:var(--muted)}
.ct.on b{color:var(--navy)}
.ct.none b{color:#F3C8A8}
.ct.none.on b{color:var(--warn)}
.brands{display:flex;gap:6px;flex-wrap:wrap;padding-top:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip span{color:var(--muted);margin-left:4px}
.chip.on span{color:#C9D0DA}
.bd{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:#EEF1F5;color:var(--muted);margin-bottom:3px}
.bd.none{background:#FBECEA;color:var(--warn)}

/* ---------- baris filter ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:14px}
.fbar select,.fbar input[type=date]{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;
  padding:0 8px;font-size:13px;max-width:190px}
.fbar select.on,.fbar input.on{border-color:var(--navy-2);background:#EEF3FB;font-weight:600}
.fbar .tg{height:34px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 12px;cursor:pointer;font-size:13px}
.fbar .tg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fbar .tg.warn.on{background:var(--warn);border-color:var(--warn)}
.fbar .rst{height:34px;border:0;background:transparent;color:var(--navy-2);cursor:pointer;font-size:13px;font-weight:600;padding:0 6px}
.fbar .rst:hover{text-decoration:underline}
.fbar .rng{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.sumlink{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sumlink:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- pipeline (filter) ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 40px}
.pipe{display:flex;gap:4px;margin:-1px 0 18px;padding-top:14px;flex-wrap:wrap}
.seg{flex:var(--g,1) 1 120px;min-width:0;border:0;cursor:pointer;text-align:left;
  padding:10px 12px 11px;background:var(--card);border-top:4px solid var(--c);
  border-radius:0 0 6px 6px;transition:opacity .15s, background .15s}
.seg .n{display:block;font-size:24px;font-weight:700;line-height:1.1;color:var(--c)}
.seg .l{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg[data-f="all"],.seg[data-f="aktif"]{--c:var(--navy);flex:0 0 96px}
.seg[data-f="belum"]{--c:var(--belum)} .seg[data-f="spk"]{--c:var(--spk)}
.seg[data-f="do"]{--c:var(--do)} .seg[data-f="tidak"]{--c:var(--tidak)} .seg[data-f="batal"]{--c:var(--batal)}
.pipe.filtered .seg:not(.on){opacity:.5}
.seg.on{background:#fff;box-shadow:inset 0 -2px 0 var(--c)}
.seg:hover{opacity:1}

/* ---------- table ---------- */
.board{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:calc(100vh - 230px)}
table{width:100%;border-collapse:collapse;min-width:1180px}
thead th{position:sticky;top:0;z-index:1;background:#F7F8FA;text-align:left;font-weight:600;
  font-size:12.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{box-shadow:inset 3px 0 0 var(--c,transparent)}
tbody tr:hover{background:#FAFBFC}
tr.st-belum{--c:var(--belum)} tr.st-spk{--c:var(--spk)} tr.st-do{--c:var(--do)}
tr.st-tidak{--c:var(--tidak)} tr.st-batal{--c:var(--batal)}
tr.saving{opacity:.45;pointer-events:none}
.c-no{width:44px;color:var(--muted)}
/* kolom Lead tetap terlihat saat tabel digeser ke kanan */
td.c-lead{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:inset 3px 0 0 var(--c,transparent)}
tbody tr:hover td.c-lead{background:#FAFBFC}
thead th.c-lead{left:0;z-index:3}
.nm{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.tel{color:var(--navy-2);text-decoration:none;font-size:13px}
.tel:hover{text-decoration:underline}
.age{font-size:12.5px;color:var(--muted)}
.age.warn{color:var(--warn);font-weight:600}
.qs{width:100%;min-width:132px;height:32px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 6px;cursor:pointer}
.qs:disabled{background:#F4F5F7;color:#9AA1AB;cursor:not-allowed}
.qs.has{border-color:var(--c);font-weight:600}
.c-ket{min-width:220px;max-width:300px}
.ket{white-space:pre-wrap;word-break:break-word;cursor:text;padding:5px 7px;margin:-5px -7px;border-radius:5px;
  border:1px dashed transparent;min-height:30px}
.ket:hover,.ket:focus-visible{border-color:#B9C2CE;background:#FAFBFC}
.ket.nil{color:#9AA1AB}
.ket-in{width:100%;min-height:64px;border:1px solid var(--navy-2);border-radius:5px;padding:6px 8px;resize:vertical;
  font:inherit;line-height:1.4;background:#fff}
.ket-tip{font-size:11.5px;color:var(--muted);margin-top:3px}
.c-act{width:84px;white-space:nowrap;text-align:right}
.ib{width:32px;height:32px;border:1px solid transparent;border-radius:5px;background:transparent;cursor:pointer;
  display:inline-grid;place-items:center;color:var(--muted)}
.ib:hover{background:#EEF1F5;color:var(--ink)}
.ib.del:hover{background:#FBECEA;color:var(--batal)}
.ib svg{width:16px;height:16px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty button{margin-top:12px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:flex-start;justify-content:center;
  padding:6vh 16px;z-index:10;overflow:auto}
.ov.open{display:flex}
.modal{background:#fff;border-radius:8px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(20,28,40,.3)}
.modal.sm{max-width:420px}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.mh h2{margin:0;font-size:17px;margin-right:auto}
.mb{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.mb .full{grid-column:1/-1}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.f label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:5px;padding:0 10px;background:#fff}
.f textarea{height:64px;padding:8px 10px;resize:vertical}
.f input:disabled,.f select:disabled{background:#F4F5F7;color:#9AA1AB}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.f .hint.bad{color:var(--warn)}
.grp{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:14px;border-radius:6px;background:#F7F8FA}
.grp-t{grid-column:1/-1;font-weight:600;font-size:13px;margin:0}
.btn-line{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-line:hover{background:#F4F5F7}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-red{background:var(--batal);color:#fff}
.btn-red:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:wait}
.err{grid-column:1/-1;background:#FBECEA;color:var(--batal);padding:8px 12px;border-radius:5px;font-size:13px;display:none}
.err.show{display:block}

/* ---------- PIN ---------- */
.gate{position:fixed;inset:0;z-index:30;background:var(--navy);display:none;align-items:center;justify-content:center;padding:24px}
.gate.open{display:flex}
.gate form{width:100%;max-width:320px;color:#fff}
.gate h2{margin:0 0 4px;font-size:22px}
.gate p{margin:0 0 20px;color:#C9D5E6;font-size:14px}
.gate label{display:block;font-size:13px;color:#C9D5E6;margin:12px 0 5px}
.gate input{width:100%;height:48px;border:0;border-radius:6px;padding:0 14px;font-size:17px;color:var(--ink)}
.gate #gPin{font-size:22px;letter-spacing:.3em}
.sec{grid-column:1/-1;font-weight:700;font-size:13px;color:var(--navy);margin:6px 0 -4px;
  padding-top:10px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:0}
.info-area{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.f .req{color:var(--warn)}
.fmeta{grid-column:1/-1;font-size:12px;color:var(--muted);margin:0}
.gate .btn{width:100%;justify-content:center;margin-top:12px;height:46px}
.gate .gerr{min-height:20px;margin-top:10px;color:#FFD2CC;font-size:13.5px}

/* ---------- riwayat ---------- */
.nm-btn{all:unset;font-weight:600;cursor:pointer;border-radius:3px}
.nm-btn:hover{text-decoration:underline}
.nm-btn:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.lb{padding:4px 20px 18px;max-height:65vh;overflow:auto}
.lhead{padding:12px 20px 0;color:var(--muted);font-size:13px}
.lg{display:grid;grid-template-columns:118px 1fr;gap:2px 14px;padding:11px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border-bottom:0}
.lg time{color:var(--muted);font-size:12.5px;padding-top:1px}
.lg .txt{white-space:pre-wrap;word-break:break-word}
.lg .by{grid-column:2;font-size:12px;color:var(--muted)}
.bd.hot{background:#FBECEA;color:var(--batal)} .bd.med{background:#FDF3E1;color:#9A6A0F}

/* ---------- toast & loading ---------- */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:6px;font-size:13.5px;transition:all .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--batal)}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* ---------- mobile: tabel jadi kartu ---------- */
@media (max-width:760px){
  .top{padding:14px 14px 16px}
  .search{flex:1 1 100%;order:3}
  .wrap{padding:0 12px 30px}
  .seg{flex:1 1 calc(33.33% - 4px)}
  .seg[data-f="all"],.seg[data-f="aktif"]{flex:1 1 calc(33.33% - 4px)}
  .seg .n{font-size:20px}
  /* tabel sama seperti desktop, digeser ke kanan */
  .board{max-height:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:1040px;font-size:13.5px}
  thead th,tbody td{padding:9px 10px}
  .c-no{display:none}
  td.c-lead,th.c-lead{min-width:132px;max-width:150px}
  .c-ket{min-width:190px}
  .mb,.grp{grid-template-columns:1fr}
  .ov.full{padding:0}
  .ov.full .modal{max-width:none;min-height:100%;border-radius:0}
  .fbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .fbar > *{flex:0 0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="title">Leads</h1>
      <p id="sum">Memuat data…</p>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari nama, kontak, unit, SPV, kota" aria-label="Cari lead">
    </label>
    <button class="btn btn-ghost" id="btnReload" title="Ambil data terbaru dari sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      Muat ulang
    </button>
    <button class="btn btn-ghost" id="btnOut" title="Keluar dari HP ini">Keluar</button>
    <button class="btn btn-primary" id="btnAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      Tambah lead
    </button>
  </div>
  <nav class="cmp" id="cmp" aria-label="Pilih perusahaan"></nav>
</header>

<main class="wrap">
  <div class="brands" id="brands" hidden></div>
  <div class="fbar" id="fbar" role="group" aria-label="Filter"></div>
  <nav class="pipe" id="pipe" aria-label="Filter status"></nav>
  <div class="board" id="board"><div class="loading">Memuat data dari sheet…</div></div>
</main>

<!-- Form tambah / edit -->
<div class="ov" id="ovForm" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <form class="modal" id="form" novalidate>
    <div class="mh">
      <h2 id="fTitle">Tambah lead</h2>
      <button type="button" class="ib" data-close aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="mb">
      <div class="err" id="fErr"></div>
      <div class="f"><label for="f_brand">Brand</label><select id="f_brand" required></select></div>
      <div class="f"><label>Perusahaan</label><input id="f_pt" disabled></div>
      <div class="f full"><label for="f_nama">Nama leads</label><input id="f_nama" autocomplete="off" required></div>
      <div class="f"><label for="f_kontak">Kontak</label><input id="f_kontak" inputmode="tel" autocomplete="off" placeholder="08xxxxxxxxxx">
        <div class="hint" id="kHint"></div></div>
      <div class="f"><label for="f_unit">Unit</label><input id="f_unit" autocomplete="off" placeholder="Calya, Rush GR MT"></div>
      <div class="f"><label for="f_spv">SPV</label><input id="f_spv" list="dlSpv" autocomplete="off"></div>
      <div class="f"><label for="f_kota">Kota</label><input id="f_kota" list="dlKota" autocomplete="off" placeholder="BERAU"></div>
      <div class="f"><label for="f_source">Source leads</label><select id="f_source"></select></div>
      <div class="f"><label for="f_tglKirim">Tgl kirim ke SPV</label><input id="f_tglKirim" type="date"></div>
      <div class="f full"><label for="f_ket">Keterangan</label><textarea id="f_ket" placeholder="DP, tenor, catatan follow-up"></textarea></div>

      <p class="fmeta" id="fMeta"></p>
      <div class="grp">
        <p class="grp-t">Status</p>
        <div class="f"><label for="f_spk">Status SPK</label><select id="f_spk"></select></div>
        <div class="f"><label for="f_tglSpk">Tgl update SPK</label><input id="f_tglSpk" type="date"></div>
        <div class="f"><label for="f_do">Status DO</label><select id="f_do"></select>
          <div class="hint" id="doHint">Bisa diisi setelah Status SPK = SPK.</div></div>
        <div class="f"><label for="f_tglDo">Tgl update DO</label><input id="f_tglDo" type="date"></div>
      </div>
    </div>
    <div class="mf">
      <button type="button" class="btn btn-line" data-close>Batal</button>
      <button type="submit" class="btn btn-navy" id="fSubmit">Simpan lead</button>
    </div>
  </form>
</div>

<!-- Form prospek PAS -->
<div class="ov full" id="ovPas" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <form class="modal" id="pForm" novalidate>
    <div class="mh">
      <h2 id="pTitle">Tambah prospek PAS</h2>
      <button type="button" class="ib" data-close aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="mb">
      <div class="err" id="pErr"></div>
      <p class="sec">Prospek</p>
      <div class="f full"><label for="p_sales">Nama Sales <span class="req">*</span></label><select id="p_sales"></select></div>
      <div class="f full"><label for="p_nama">Nama Prospek <span class="req">*</span></label><input id="p_nama" autocomplete="off"></div>
      <div class="f full"><label for="p_kontak">No. HP Prospek <span class="req">*</span></label>
        <input id="p_kontak" inputmode="tel" autocomplete="off" placeholder="08xxxxxxxxxx"><div class="hint" id="pKHint"></div></div>

      <p class="sec">Alamat <span class="sub" style="font-weight:400">— pilih dari daftar, atau ketik sendiri kalau tidak ada</span></p>
      <div class="f"><label for="p_prov">Provinsi</label><input id="p_prov" list="dlProv" autocomplete="off" placeholder="Pilih atau ketik"></div>
      <div class="f"><label for="p_kota">Kabupaten / Kota</label><input id="p_kota" list="dlKab" autocomplete="off" placeholder="Pilih atau ketik"></div>
      <div class="f"><label for="p_kec">Kecamatan</label><input id="p_kec" list="dlKec" autocomplete="off" placeholder="Pilih atau ketik"></div>
      <div class="f"><label for="p_kel">Kelurahan / Desa</label><input id="p_kel" list="dlKel" autocomplete="off" placeholder="Pilih atau ketik"></div>
      <p class="info-area" id="pArea"></p>

      <p class="sec">Minat</p>
      <div class="f"><label for="p_kerja">Bidang Pekerjaan</label><select id="p_kerja"></select></div>
      <div class="f" id="pKerjaLainBox" hidden><label for="p_kerjaLain">Pekerjaan lainnya</label><input id="p_kerjaLain" autocomplete="off"></div>
      <div class="f"><label for="p_source">Sumber Prospek</label><select id="p_source"></select></div>
      <div class="f full"><label for="p_unit">Type Mobil <span class="req">*</span></label><select id="p_unit"></select></div>
      <div class="f"><label for="p_prospek">Status Prospek <span class="req">*</span></label>
        <select id="p_prospek"><option value="">Pilih</option><option>Hot</option><option>Medium</option><option>Low</option></select></div>
      <div class="f"><label for="p_kategori">Kategori Pembelian <span class="req">*</span></label>
        <select id="p_kategori"><option value="">Pilih</option><option>First Buyer</option><option>Additional</option><option>Replacement</option></select></div>
      <div class="f full" id="pKetBox"><label for="p_ket">Keterangan / catatan follow-up</label><textarea id="p_ket" placeholder="Opsional"></textarea></div>
      <p class="fmeta" id="pMeta"></p>
    </div>
    <div class="mf">
      <button type="button" class="btn btn-line" data-close>Batal</button>
      <button type="submit" class="btn btn-navy" id="pSubmit">Simpan prospek</button>
    </div>
  </form>
</div>

<script>
// ===================== STATE =====================
let ROWS = [], OPTS = { brand:[], source:[], spk:[], do:[], stData:[], status:[] }, TODAY = '', PT = [];
let ME = { canAddShn:false, canAddPas:false, canEdit:false, sales:[] };

const AMBANG = 14;   // ≥ 14 hari ditandai merah, sama dengan laporan Telegram

// ===== filter tambahan, diingat per HP =====
const FL_DEF = { who:'', periode:'all', dari:'', sampai:'', fu:'', kota:'', source:'', prospek:'', telat:false, noKet:false, urut:'sheet' };
let FL = { ...FL_DEF };
try { FL = { ...FL_DEF, ...JSON.parse(localStorage.getItem('leads_filter') || '{}') }; } catch (e) {}
const simpanFL = () => { try { localStorage.setItem('leads_filter', JSON.stringify(FL)); } catch (e) {} };
const AKTIF = ['belum', 'spk', 'cek', 'valid'];   // tahap yang masih perlu ditindaklanjuti

// c = warna (variabel CSS). Tampilan awal = "Aktif" (data baru + valid/SPK); yang gugur disembunyikan.
const STAGES = {
  SHN: [ { f:'belum', l:'Belum ada keputusan', c:'belum' }, { f:'spk', l:'SPK, belum DO', c:'spk' },
         { f:'do', l:'DO', c:'do' }, { f:'gugur', l:'Gugur (tidak jadi / batal)', c:'tidak' } ],
  PAS: [ { f:'cek', l:'Data baru (belum dicek)', c:'belum' }, { f:'valid', l:'Valid, belum Deal', c:'spk' },
         { f:'deal', l:'Deal', c:'do' }, { f:'gugur', l:'Gugur (drop / invalid / cancel)', c:'tidak' } ],
  all: [ { f:'g1', l:'Belum ada keputusan', c:'belum' }, { f:'g2', l:'Dalam proses', c:'spk' },
         { f:'g3', l:'Closing (DO / Deal)', c:'do' }, { f:'gugur', l:'Gugur', c:'tidak' } ]
};
// tahap mentah → kelompok
const GRUP = { belum:'belum', spk:'spk', do:'do', cek:'cek', valid:'valid', deal:'deal',
               tidak:'gugur', batal:'gugur', drop:'gugur', cancel:'gugur' };
const GEN  = { belum:'g1', cek:'g1', spk:'g2', valid:'g2', do:'g3', deal:'g3', gugur:'gugur' };
const WARNA = { belum:'belum', cek:'belum', spk:'spk', valid:'spk', do:'do', deal:'do',
                tidak:'tidak', drop:'tidak', batal:'batal', cancel:'batal' };

const $  = s => document.querySelector(s);
const up = v => String(v ?? '').trim().toUpperCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s ?? '').replace(/\D/g, '');

function inScope(r) {
  if (CMP === 'all') return true;
  if (r.pt !== CMP) return false;
  return BRAND === 'all' || up(r.brand) === up(BRAND);
}
function stageRaw(r) {
  if (r.pt === 'PAS') {
    if (up(r.status) === 'DEAL') return 'deal';
    if (up(r.status) === 'CANCEL') return 'cancel';
    const s = up(r.stData);
    if (!s) return 'cek';
    return s === 'VALID' ? 'valid' : 'drop';
  }
  if (!String(r.spk).trim()) return 'belum';
  if (up(r.spk) === 'TIDAK JADI SPK') return 'tidak';
  if (up(r.do) === 'BATAL DO') return 'batal';
  if (up(r.do) === 'DO') return 'do';
  return 'spk';
}
const stage = r => CMP === 'all' ? GEN[GRUP[stageRaw(r)]] : GRUP[stageRaw(r)];
const isAktif = r => AKTIF.includes(stageRaw(r));
const stageList = () => STAGES[CMP] || STAGES.all;
const rowOf = tr => ROWS.find(x => x.id === tr.dataset.id && x.pt === tr.dataset.pt);

function fuHari(r) {                // hari sejak keterangan terakhir; belum pernah → sejak tanggal masuk
  const ref = (r.lastFu || '').slice(0, 10) || r.tglKirim;
  return days(ref);
}
function bulanOffset(ymd, n) {
  const [y, m] = TODAY.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return ymd && ymd.slice(0, 7) === `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function lolosFilter(r) {
  if (FL.who && up(r.spv) !== up(FL.who)) return false;
  if (FL.kota && up(r.kota) !== up(FL.kota)) return false;
  if (FL.source && up(r.source) !== up(FL.source)) return false;
  if (FL.prospek && !(r.pt === 'PAS' && up(r.prospek).startsWith(FL.prospek))) return false;
  if (FL.noKet && String(r.ket || '').trim()) return false;
  if (FL.periode !== 'all') {
    const t = r.tglKirim;
    if (!t) return false;
    if (FL.periode === '7' && !(days(t) >= 0 && days(t) <= 6)) return false;
    if (FL.periode === 'ini' && !bulanOffset(t, 0)) return false;
    if (FL.periode === 'lalu' && !bulanOffset(t, -1)) return false;
    if (FL.periode === 'custom' && ((FL.dari && t < FL.dari) || (FL.sampai && t > FL.sampai))) return false;
  }
  if (FL.telat && !(['belum','cek'].includes(stageRaw(r)) && (days(r.tglKirim) ?? -1) >= AMBANG)) return false;
  if (FL.fu && !(AKTIF.includes(stageRaw(r)) && (fuHari(r) ?? 0) > Number(FL.fu))) return false;
  return true;
}
function jumlahFilterAktif() {
  return Object.keys(FL_DEF).filter(k => k !== 'dari' && k !== 'sampai' && k !== 'urut' && FL[k] !== FL_DEF[k]).length;
}
function urutkan(list) {
  const t = r => r.tglKirim || '';
  if (FL.urut === 'lama') return list.sort((a, b) => t(a).localeCompare(t(b)));
  if (FL.urut === 'baru') return list.sort((a, b) => t(b).localeCompare(t(a)));
  if (FL.urut === 'fu')   return list.sort((a, b) => (fuHari(b) ?? -1) - (fuHari(a) ?? -1));
  return list;
}
function fuTeks(r) {
  if (!r.lastFu) return '';
  const h = days(r.lastFu.slice(0, 10));
  return h === 0 ? 'FU hari ini' : h === 1 ? 'FU kemarin' : `FU ${h} hari lalu`;
}

function renderFilters(base) {
  const opsi = k => [...new Set(base.map(r => String(r[k] ?? '').trim()).filter(Boolean))]
                      .sort((a, b) => a.localeCompare(b, 'id'));

      <option value="${FL_DEF[key]}">${label}</option>

        return `<option value="${esc(v)}" ${v === FL[key] ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}
    </select>`;
  };
  const whoLabel = CMP === 'PAS' ? 'Semua sales' : CMP === 'SHN' ? 'Semua SPV' : 'Semua SPV / sales';
  const adaPas = base.some(r => r.pt === 'PAS');

  $('#fbar').innerHTML =

    sel('periode', 'Semua periode', [['7','7 hari terakhir'], ['ini','Bulan ini'], ['lalu','Bulan lalu'], ['custom','Pilih tanggal']], true) +
    (FL.periode === 'custom' ? `<span class="rng">
        <input type="date" data-fl="dari" value="${esc(FL.dari)}" aria-label="Dari tanggal" class="${FL.dari ? 'on' : ''}"> s/d
        <input type="date" data-fl="sampai" value="${esc(FL.sampai)}" aria-label="Sampai tanggal" class="${FL.sampai ? 'on' : ''}"></span>` : '') +
    sel('fu', 'Semua FU', [['3','Belum FU > 3 hari'], ['7','Belum FU > 7 hari'], ['14','Belum FU > 14 hari']], true) +
    sel('kota', 'Semua kota', opsi('kota')) +
    sel('source', 'Semua source', opsi('source')) +
    (adaPas ? sel('prospek', 'Semua prospek (PAS)', [['HOT','Hot'], ['MEDIUM','Medium'], ['LOW','Low']], true) : '') +
    `<button class="tg warn ${FL.telat ? 'on' : ''}" data-tg="telat" aria-pressed="${FL.telat}">Terlambat ≥ ${AMBANG} hari</button>` +
    `<button class="tg ${FL.noKet ? 'on' : ''}" data-tg="noKet" aria-pressed="${FL.noKet}">Tanpa keterangan</button>` +
    sel('urut', 'Urutan sheet', [['lama','Terlama masuk'], ['baru','Terbaru masuk'], ['fu','FU paling lama']], true) +
    (n || FL.urut !== 'sheet' ? `<button class="rst" data-rst>Reset${n ? ` (${n})` : ''}</button>` : '');
}

function days(ymd) {
  if (!ymd || !TODAY) return null;
  return Math.round((Date.parse(TODAY) - Date.parse(ymd)) / 86400000);
}
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmt(ymd) {
  if (!ymd) return '';
  const [y, m, d] = ymd.split('-');
  return `${+d} ${BLN[+m - 1]} ${y.slice(2)}`;
}

const hariIni = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Makassar' }).format(new Date());
const ymd = iso => iso ? new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Makassar' }).format(new Date(iso)) : '';
const ymdhm = iso => {
  if (!iso) return '';
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Makassar', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day} ${p.hour === '24' ? '00' : p.hour}:${p.minute}`;
};
const fmtWaktu = iso => { const t = ymdhm(iso); return t ? `${fmt(t.slice(0, 10))} ${t.slice(11)}` : ''; };
function rapiKontak(v) {
  const s = String(v ?? '').trim().replace(/[\s-]/g, '').replace(/^\+/, '');

  if (/^628\d{7,12}$/.test(s)) return '0' + s.slice(2);
  return s;
}
const kosongJadiNull = v => { const s = String(v ?? '').trim(); return s ? s : null; };

// pesan error database → bahasa Indonesia
function pesanError(err) {
  const m = String(err && (err.message || err.details || err) || '');
  if (/do_butuh_spk/.test(m)) return 'Status DO hanya bisa diisi kalau Status SPK = SPK.';
  if (/row-level security/i.test(m) && ME && ME.role === 'SALES') return 'Prospek yang sudah di-follow-up tidak bisa dihapus.';
  if (/row-level security/i.test(m) && /lead_pas/.test(m) && ME && ME.jembatan)
    return 'Input prospek PAS baru dibuka setelah pindah dari AppSheet.';
  if (/row-level security|permission denied|42501/i.test(m)) return 'Akun Anda tidak diizinkan melakukan ini.';
  if (/JWT|refresh token|not authenticated/i.test(m)) return 'AUTH: Sesi berakhir, silakan masuk lagi.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Tidak bisa terhubung ke server. Cek koneksi internet.';
  return m.replace(/^.*?ERROR:\s*/, '') || 'Terjadi kesalahan.';
}
function cek(res) { if (res.error) throw new Error(pesanError(res.error)); return res.data; }

let MASTER = null;    // area, tipe, pilihan — dimuat sekali
async function ambilMaster() {
  const [area, tipe, pil] = await Promise.all([
    SB.from('master_area').select('provinsi,kab_kota,kecamatan,kelurahan,kode_pos,ring,pic_area').limit(5000),

    SB.from('master_pilihan').select('jenis,nilai,urutan').order('urutan')
  ]);
  MASTER = { area: cek(area), tipe: cek(tipe), pilihan: cek(pil) };
}

async function ambilData() {
  if (!MASTER) await ambilMaster();
  const [prof, shn, pas, fu, atur, sales] = await Promise.all([
    SB.from('profil').select('*'),
    SB.from('lead_shn').select('*').order('nomor'),
    SB.from('lead_pas').select('*').order('ts'),
    SB.rpc('fu_terakhir'),
    SB.from('pengaturan').select('kunci,nilai'),
    SB.rpc('daftar_sales')
  ]);
  const jembatan = (cek(atur) || []).some(x => x.kunci === 'jembatan_sheet' && x.nilai === 'ya');
  const profil = cek(prof);
  PROFIL = Object.fromEntries(profil.map(p => [p.id, p.nama]));
  const p = profil.find(x => x.id === MYID);
  if (!p || !p.aktif) throw new Error('AUTH: Akun belum punya profil atau sudah dinonaktifkan. Hubungi admin.');
  const admin = p.role === 'ADMIN';
  const lihatShn = admin || (p.role !== 'SALES' && (p.pt === 'SEMUA' || p.pt === 'SHN'));
  const lihatPas = admin || p.pt === 'SEMUA' || p.pt === 'PAS';
  const hapus = admin ? 'SEMUA' : p.boleh_hapus;
  const me = { id: p.id, nama: p.nama, role: p.role, pt: admin ? 'SEMUA' : p.pt, spv: p.nama_spv || p.nama,
               canAddShn: (admin || p.boleh_tambah) && lihatShn,
               canAddPas: (admin || p.boleh_tambah) && lihatPas && !jembatan,
               izinAddPas: (admin || p.boleh_tambah) && lihatPas,
               canEdit: admin || p.boleh_edit, hapus, jembatan,
               sales: [...new Set((sales.error ? [] : sales.data || []).map(x => x.nama))] };

  const fuMap = {};
  (cek(fu) || []).forEach(f => { fuMap[f.pt + '|' + f.lead_id] = f.waktu; });
  const lebihBaru = (a, b) => !a ? b : !b ? a : (new Date(a) > new Date(b) ? a : b);

  const rows = cek(shn).map(r => ({
    pt: 'SHN', id: r.id, no: String(r.nomor), brand: r.brand || '', spv: r.spv || '', kota: r.kota || '',
    nama: r.nama, kontak: r.kontak || '', unit: r.unit || '', ket: r.keterangan || '', source: r.source || '',
    tglKirim: r.tgl_kirim || '', spk: r.status_spk || '', tglSpk: r.tgl_spk || '', do: r.status_do || '', tglDo: r.tgl_do || '',
    inputBy: PROFIL[r.input_by] || '', editBy: PROFIL[r.edit_by] || '', editAt: fmtWaktu(r.edit_at),
    lastFu: ymdhm(fuMap['SHN|' + r.id]),
    canDel: hapus === 'SEMUA' || (hapus === 'SENDIRI' && r.input_by === p.id)
  })).concat(cek(pas).map(r => ({
    pt: 'PAS', id: r.id, no: String((r.baris || 1) - 1), brand: r.brand || '', spv: r.sales || '', kota: r.kota || '',
    nama: r.nama, kontak: r.kontak || '', unit: r.unit || '', ket: r.keterangan || '', source: r.source || '',
    tglKirim: ymd(r.ts), prospek: r.prospek || '', tglFu: fmtWaktu(r.tgl_fu), stData: r.status_data || '', status: r.status || '',
    provinsi: r.provinsi || '', kecamatan: r.kecamatan || '', kelurahan: r.kelurahan || '', pekerjaan: r.pekerjaan || '',
    kategori: r.kategori || '', kodePos: r.kode_pos || '', ring: r.ring || '', pic: r.pic_area || '', asal: r.asal,
    inputBy: PROFIL[r.input_by] || '', editBy: PROFIL[r.diubah_oleh] || '', editAt: fmtWaktu(r.diubah_pada),
    lastFu: ymdhm(lebihBaru(fuMap['PAS|' + r.id], r.tgl_fu)),
    bisaEdit: !jembatan || r.asal === 'web',
    canDel: (r.asal === 'web' || !jembatan) && (hapus === 'SEMUA' || (hapus === 'SENDIRI' && r.input_by === p.id))
            && !(p.role === 'SALES' && (r.status_data || r.status || r.keterangan || fuMap['PAS|' + r.id]))
  })));

  const src = [...new Set(['Google', 'Instagram', 'Facebook', 'Walk In', 'Referensi']
                .concat(rows.filter(r => r.pt === 'SHN').map(r => r.source).filter(Boolean)))];
  return JSON.stringify({
    rows, today: hariIni(), me, pasMulai: PAS_MULAI,
    perusahaan: PERUSAHAAN.filter(x => x.kode === 'SHN' ? lihatShn : lihatPas),
    opts: { brand: ['Toyota'], source: src, spk: ['SPK', 'Tidak Jadi SPK'], do: ['DO', 'Batal DO'],
            stData: ['Valid', 'Drop', 'Invalid'], status: ['DEAL', 'CANCEL'] }
  });
}

async function simpanShn(p) {
  const isi = {
    brand: kosongJadiNull(p.brand) || 'Toyota', spv: kosongJadiNull(p.spv), kota: kosongJadiNull(p.kota),
    nama: String(p.nama || '').trim(), kontak: kosongJadiNull(rapiKontak(p.kontak)), unit: kosongJadiNull(p.unit),
    keterangan: kosongJadiNull(p.ket), source: kosongJadiNull(p.source), tgl_kirim: kosongJadiNull(p.tglKirim),
    status_spk: kosongJadiNull(p.spk), tgl_spk: kosongJadiNull(p.spk) ? kosongJadiNull(p.tglSpk) : null,
    status_do: kosongJadiNull(p.do),   tgl_do: kosongJadiNull(p.do) ? kosongJadiNull(p.tglDo) : null
  };
  if (!isi.nama) throw new Error('Nama leads wajib diisi.');
  if (isi.keterangan && isi.keterangan.length > 1000) throw new Error('Keterangan maksimal 1000 karakter.');
  const res = p.id
    ? await SB.from('lead_shn').update(isi).eq('id', p.id).select('id')
    : await SB.from('lead_shn').insert(isi).select('id');
  if (!cek(res).length) throw new Error(p.id ? 'Perubahan tidak tersimpan: lead di luar akses atau akun tidak boleh mengubah.'
                                             : 'Lead tidak tersimpan: akun tidak boleh menambah lead untuk SPV ini.');
}

async function simpanPas(p) {

    sales: kosongJadiNull(p.sales), nama: String(p.nama || '').trim(), kontak: kosongJadiNull(rapiKontak(p.kontak)),
    provinsi: kosongJadiNull(p.provinsi), kota: kosongJadiNull(p.kota), kecamatan: kosongJadiNull(p.kecamatan),
    kelurahan: kosongJadiNull(p.kelurahan), pekerjaan: kosongJadiNull(p.pekerjaan), source: kosongJadiNull(p.source),
    unit: kosongJadiNull(p.unit), prospek: kosongJadiNull(p.prospek), kategori: kosongJadiNull(p.kategori),
    keterangan: kosongJadiNull(p.ket)
  };
  if (ME.role === 'SALES') delete isi.keterangan;      // keterangan diisi SPV saat follow-up
  const res = p.id
    ? await SB.from('lead_pas').update(isi).eq('id', p.id).select('id')
    : await SB.from('lead_pas').insert(isi).select('id');
  if (!cek(res).length) throw new Error(p.id ? 'Perubahan tidak tersimpan: prospek di luar akses atau akun tidak boleh mengubah.'
                                             : 'Prospek tidak tersimpan: akun tidak boleh menambah prospek.');
}

// dipanggil seluruh tampilan; bentuk hasil sama seperti versi Apps Script
async function api(action, payload = {}) {
  try {
    if (action === 'data') return await ambilData();
    if (action === 'save') { await simpanShn(payload.row); return await ambilData(); }
    if (action === 'savePasLead') { await simpanPas(payload.row); return await ambilData(); }
    if (action === 'delete') {
      const tabel = payload.pt === 'PAS' ? 'lead_pas' : 'lead_shn';
      if (!cek(await SB.from(tabel).delete().eq('id', payload.id).select('id')).length)
        throw new Error(ME.hapus === 'SENDIRI' ? 'Anda hanya bisa menghapus lead yang Anda input sendiri.'
                                               : 'Akun Anda tidak diizinkan menghapus lead.');
      return await ambilData();
    }
    if (action === 'savePas') {
      const kolom = { stData: 'status_data', status: 'status', ket: 'keterangan' }[payload.field];
      if (!kolom) throw new Error('Kolom ini tidak bisa diubah.');
      const res = await SB.from('lead_pas').update({ [kolom]: kosongJadiNull(payload.value) }).eq('id', payload.id).select('id');
      if (!cek(res).length) throw new Error('Perubahan tidak tersimpan: akun tidak boleh mengubah data PAS.');
      return await ambilData();
    }
    if (action === 'log') {
      const d = cek(await SB.from('riwayat').select('keterangan,oleh,sumber,waktu')
                          .eq('pt', payload.pt).eq('lead_id', payload.id).order('waktu', { ascending: false }).limit(200));
      return { log: d.map(x => ({ waktu: fmtWaktu(x.waktu), kolom: 'Keterangan', lama: '', baru: x.keterangan,
                                 oleh: x.oleh, sumber: x.sumber })) };
    }
    throw new Error('Aksi tidak dikenal.');
  } catch (e) {
    const m = pesanError(e);
    if (m.startsWith('AUTH:')) { await SB.auth.signOut(); TOKEN = ''; showGate(m.slice(5).trim()); }
    throw new Error(m.replace(/^AUTH:\s*/, ''));
  }
}

function showGate(msg) {
  $('#gErr').textContent = msg || '';
  $('#gPin').value = '';
  try { $('#gNama').value = localStorage.getItem('leads_nama') || ''; } catch (e) {}
  $('#gate').classList.add('open');
  setTimeout(() => ($('#gNama').value ? $('#gPin') : $('#gNama')).focus(), 50);
}
$('#gForm').addEventListener('submit', async e => {
  e.preventDefault();
  const nama = $('#gNama').value.trim(), pin = $('#gPin').value.trim();
  if (!nama || !pin) { $('#gErr').textContent = 'Isi nama dan PIN.'; return; }
  const b = $('#gBtn'); b.disabled = true; $('#gErr').textContent = '';
  try {
    const { data, error } = await SB.auth.signInWithPassword({ email: emailDari(nama), password: pin });
    if (error) throw new Error(/invalid login|invalid credentials/i.test(error.message) ? 'Nama atau PIN salah.'
                             : /rate|too many/i.test(error.message) ? 'Terlalu banyak percobaan. Tunggu beberapa menit.'
                             : pesanError(error));
    MYID = data.user.id; TOKEN = '1';
    try { localStorage.setItem('leads_nama', nama); } catch (e) {}
    $('#gate').classList.remove('open');
    await refresh();
  } catch (ex) {
    $('#gErr').textContent = ex.message; $('#gPin').select();
  } finally { b.disabled = false; }
});
function load(json) {
  const d = JSON.parse(json);
  ROWS = d.rows; OPTS = d.opts; TODAY = d.today; PT = d.perusahaan; ME = d.me;
  if (PT.length === 1 && CMP === 'all') CMP = PT[0].kode;

// form mana yang dibuka tombol Tambah: 'SHN' | 'PAS' | 'PAS_KUNCI' (boleh, tapi masih masa AppSheet) | ''

function sel(field, val, list, emptyLabel, disabled, why) {
  const v = String(val ?? '').trim();
  const items = list.slice();
  if (v && !items.some(x => up(x) === up(v))) items.push(v);   // nilai lama di luar dropdown tetap tampil
  return `<select class="qs ${v ? 'has' : ''}" data-field="${field}" ${disabled ? `disabled title="${why || ''}"` : ''}>
    <option value="">${emptyLabel}</option>
    ${items.map(x => `<option ${up(x) === up(v) ? 'selected' : ''}>${esc(x)}</option>`).join('')}
  </select>`;
}

const isSales = () => ME.role === 'SALES';     // sales: input data saja; follow-up (status & keterangan) oleh SPV
function badgeProspek(p) {
  const u = up(p);
  if (!u) return '';

  if (u.startsWith('MEDIUM')) return '<span class="bd med">Medium</span>';
  return '<span class="bd">Low</span>';

function renderCompany() {

function render() {
  renderCompany();
  const BASE = ROWS.filter(inScope);
  renderFilters(BASE);
  const SCOPE = BASE.filter(lolosFilter);
  const ST = stageList();
  if (isSales()) FILTER = 'all';                 // sales tidak melihat status, jadi tampilkan semua prospeknya
  $('#pipe').hidden = isSales();
  if (!['all','aktif'].includes(FILTER) && !ST.some(s => s.f === FILTER)) FILTER = 'aktif';

  const cnt = { all: SCOPE.length, aktif: SCOPE.filter(isAktif).length };
  ST.forEach(s => cnt[s.f] = 0);
  SCOPE.forEach(r => cnt[stage(r)]++);
  const telat = SCOPE.filter(r => ['belum','cek'].includes(stageRaw(r)) && (days(r.tglKirim) ?? -1) >= AMBANG).length;
  $('#sum').innerHTML = isSales() ? `${SCOPE.length} prospek` : `${cnt.aktif} lead aktif dari ${SCOPE.length}` + (telat
    ? `, <button class="sumlink" data-tg="telat">${telat} belum ada keputusan ≥ ${AMBANG} hari</button>` : '');

  const pipe = $('#pipe');
  pipe.classList.toggle('filtered', FILTER !== 'all');
  pipe.innerHTML =
    `<button class="seg ${FILTER === 'aktif' ? 'on' : ''}" data-f="aktif" title="Data baru + dalam proses"><span class="n">${cnt.aktif}</span><span class="l">Aktif</span></button>` +
    ST.map(s => `<button class="seg ${FILTER === s.f ? 'on' : ''}" data-f="${s.f}" style="--g:${Math.max(cnt[s.f], 1)};--c:var(--${s.c})">
      <span class="n">${cnt[s.f]}</span><span class="l">${s.l}</span></button>`).join('') +
    `<button class="seg ${FILTER === 'all' ? 'on' : ''}" data-f="all"><span class="n">${cnt.all}</span><span class="l">Semua</span></button>`;

  const uniq = k => [...new Set(ROWS.filter(r => r.pt === 'SHN').map(r => String(r[k]).trim()).filter(Boolean))].sort();
  $('#dlSpv').innerHTML  = uniq('spv').map(v => `<option value="${esc(v)}">`).join('');
  $('#dlKota').innerHTML = uniq('kota').map(v => `<option value="${esc(v)}">`).join('');

  const q = Q.toLowerCase();
  const list = urutkan(SCOPE.filter(r =>
    (FILTER === 'all' || (FILTER === 'aktif' ? isAktif(r) : stage(r) === FILTER)) &&
    (!q || [r.nama, r.kontak, r.unit, r.brand, r.spv, r.kota, r.ket, r.source, r.prospek]
             .some(v => String(v ?? '').toLowerCase().includes(q)))));

  if (!list.length) {
    $('#board').innerHTML = `<div class="empty">${
      q ? `Tidak ada lead yang cocok dengan “${esc(Q)}”.`
        : SCOPE.length ? 'Tidak ada lead di kategori ini.'
        : BASE.length ? 'Tidak ada lead yang lolos filter. <br><button class="btn btn-line" data-rst>Reset filter</button>'
        : 'Belum ada lead untuk pilihan ini.'}</div>`;
    return;
  }
  const H = CMP === 'PAS' ? ['Sales / Kota', 'Tanggal masuk', 'Status Data', 'Status']
          : CMP === 'SHN' ? ['SPV / Kota', 'Kirim ke SPV', 'Status SPK', 'Status DO']
          : ['SPV / Sales', 'Tanggal', 'Status SPK / Data', 'Status DO / Deal'];
  $('#board').innerHTML = `<table>
    <thead><tr><th class="c-no">No</th><th class="c-lead">Lead</th><th>${H[0]}</th><th>Unit</th><th>Source</th>
      <th>${H[1]}</th><th>Keterangan</th>${isSales() ? '' : `<th>${H[2]}</th><th>${H[3]}</th>`}<th></th></tr></thead>
    <tbody>${list.map(rowHtml).join('')}</tbody></table>`;
}

async function persist(p, okMsg, trEl) {
  if (trEl) trEl.classList.add('saving');
  try {
    load(await api('save', { row: p }));
    toast(okMsg);
    return true;
  } catch (e) {
    if (trEl) trEl.classList.remove('saving');
    render();
    toast(e.message, true);
    return false;
  }
}

// ubah status langsung dari tabel
async function quickSave(tr, field, val) {
  const r = rowOf(tr);
  if (!r) return;
  if (r.pt === 'PAS') {
    if (field === 'stData' && up(val) !== 'VALID' && r.status) {
      toast('Kosongkan Status (DEAL/CANCEL) dulu sebelum mengubah Status Data.', true);
      return render();
    }
    tr.classList.add('saving');
    try {
      load(await api('savePas', { id: r.id, field, value: val }));
      toast(`${r.nama}: ${val || 'status dikosongkan'}`);
    } catch (e) { render(); toast(e.message, true); }
    return;
  }
  const p = { ...r, [field]: val };
  if (field === 'spk') {
    if (up(val) !== 'SPK' && r.do) {
      toast('Kosongkan Status DO dulu sebelum mengubah Status SPK.', true);
      return render();
    }
    p.tglSpk = val ? TODAY : '';
  }
  if (field === 'do') p.tglDo = val ? TODAY : '';
  await persist(p, `${r.nama}: ${val || 'status dikosongkan'}`, tr);
}

const FIELDS = ['brand','nama','kontak','unit','spv','kota','source','tglKirim','ket','spk','tglSpk','do','tglDo'];

function fillSelect(el, list, emptyLabel, cur) {
  const items = list.slice();
  if (cur && !items.some(x => up(x) === up(cur))) items.push(cur);
  el.innerHTML = `<option value="">${emptyLabel}</option>` +
    items.map(x => `<option ${up(x) === up(cur) ? 'selected' : ''}>${esc(x)}</option>`).join('');
}

function syncStatus(fromUser) {
  const spk = F('spk').value, isSpk = up(spk) === 'SPK';
  if (fromUser === 'spk') F('tglSpk').value = spk ? (F('tglSpk').value || TODAY) : '';
  F('tglSpk').disabled = !spk;

  if (!isSpk) { F('do').value = ''; F('tglDo').value = ''; }
  F('do').disabled = !isSpk;
  $('#doHint').style.display = isSpk ? 'none' : 'block';

  const dov = F('do').value;
  if (fromUser === 'do') F('tglDo').value = dov ? (F('tglDo').value || TODAY) : '';
  F('tglDo').disabled = !dov;
}

function syncPt() { F('pt').value = 'SHN'; }

function checkKontak() {
  const k = digits(F('kontak').value), h = $('#kHint');
  const dup = k && ROWS.find(r => r.id !== EDIT_ID && digits(r.kontak) === k);
  h.textContent = dup ? `Nomor ini sudah tercatat atas nama ${dup.nama} (No ${dup.no}).` : '';
  h.classList.toggle('bad', !!dup);
}

function openForm(id) {
  EDIT_ID = id || null;

  $('#fTitle').textContent = id ? `Edit lead: ${r.nama}` : 'Tambah lead SHN';

  $('#fErr').classList.remove('show');

}

                          : (P('kel').value ? 'Alamat di luar daftar area, diisi manual.' : '');
}
// pilihan tingkat atas berubah → kosongkan tingkat di bawahnya
[['prov', ['kota', 'kec', 'kel']], ['kota', ['kec', 'kel']], ['kec', ['kel']], ['kel', []]].forEach(([k, bawah]) => {
  let awal = '';
  P(k).addEventListener('focus', () => { awal = P(k).value; });
  P(k).addEventListener('change', () => {
    if (!samaTeks(awal, P(k).value)) bawah.forEach(b => { P(b).value = ''; });
    awal = P(k).value; isiDatalistArea();
  });
  P(k).addEventListener('input', isiDatalistArea);
});

function isiSelect(el, items, kosong, nilai, lainnya) {
  const list = items.slice();
  if (nilai && !list.includes(nilai) && !lainnya) list.push(nilai);
  el.innerHTML = `<option value="">${kosong}</option>` + list.map(v => `<option ${v === nilai ? 'selected' : ''}>${esc(v)}</option>`).join('') +
    (lainnya ? `<option value="__lain" ${nilai && !items.includes(nilai) ? 'selected' : ''}>Lainnya (isi sendiri)</option>` : '');
}
function isiTipe(nilai) {
  const grup = {};
  MASTER.tipe.forEach(t => { (grup[t.brand + ' — ' + t.model] = grup[t.brand + ' — ' + t.model] || []).push(t.tipe); });
  const ada = MASTER.tipe.some(t => t.tipe === nilai);
  P('unit').innerHTML = '<option value="">Pilih type</option>' +
    (nilai && !ada ? `<option selected>${esc(nilai)}</option>` : '') +
    Object.entries(grup).map(([g, arr]) => `<optgroup label="${esc(g)}">${arr.map(v =>
      `<option ${v === nilai ? 'selected' : ''}>${esc(v)}</option>`).join('')}</optgroup>`).join('');
}
function syncKerja() { $('#pKerjaLainBox').hidden = P('kerja').value !== '__lain'; }
P('kerja').addEventListener('change', () => { syncKerja(); if (P('kerja').value === '__lain') P('kerjaLain').focus(); });

let cekHpT;
P('kontak').addEventListener('input', () => {
  clearTimeout(cekHpT);
  const h = $('#pKHint'), v = rapiKontak(P('kontak').value);
  h.classList.remove('bad'); h.textContent = '';
  if (!v) return;
  if (!/^08\d{8,11}$/.test(v)) { h.textContent = 'Format: diawali 08, 10–13 digit.'; h.classList.add('bad'); return; }
  cekHpT = setTimeout(async () => {
    const { data } = await SB.rpc('kontak_terdaftar', { no_hp: v, kecuali: PAS_ID });
    if (data) { h.textContent = 'Nomor ini sudah terdaftar sebagai prospek. Pastikan bukan data dobel.'; h.classList.add('bad'); }
  }, 400);
});

function openPas(id) {
  PAS_ID = id || null;
  const r = id ? ROWS.find(x => x.id === id && x.pt === 'PAS') : {};
  if (id && !r) return;
  $('#pTitle').textContent = id ? `Edit prospek: ${r.nama}` : 'Tambah prospek PAS';
  $('#pErr').classList.remove('show');
  const pilih = j => MASTER.pilihan.filter(x => x.jenis === j).map(x => x.nilai);

  // nama sales: sales → namanya sendiri (terkunci); lainnya → pilih
  const isSales = ME.role === 'SALES';
  const daftar = uq(ME.sales.concat(ROWS.filter(x => x.pt === 'PAS').map(x => x.spv))).sort();
  if (isSales) { P('sales').innerHTML = `<option>${esc(ME.nama)}</option>`; P('sales').disabled = true; }
  else { isiSelect(P('sales'), daftar, 'Pilih sales', r.spv || ''); P('sales').disabled = false; }

  P('nama').value = r.nama || ''; P('kontak').value = r.kontak || ''; $('#pKHint').textContent = '';
  P('prov').value = id ? (r.provinsi || '') : 'Kalimantan Utara';
  P('kota').value = r.kota || ''; P('kec').value = r.kecamatan || ''; P('kel').value = r.kelurahan || '';
  const kerja = pilih('pekerjaan');
  isiSelect(P('kerja'), kerja, 'Pilih pekerjaan', r.pekerjaan || '', true);
  P('kerjaLain').value = r.pekerjaan && !kerja.includes(r.pekerjaan) ? r.pekerjaan : '';
  syncKerja();
  isiSelect(P('source'), pilih('sumber'), 'Pilih sumber', r.source || '');
  isiTipe(r.unit || '');
  P('prospek').value = r.prospek || ''; P('kategori').value = r.kategori || '';
  P('ket').value = r.ket || '';
  $('#pKetBox').hidden = isSales;
  $('#pMeta').textContent = id ? [r.inputBy && `Diinput oleh ${r.inputBy}`, r.editBy && `terakhir diubah ${r.editBy} (${r.editAt})`]
                                   .filter(Boolean).join(', ') : '';
  $('#pSubmit').textContent = id ? 'Simpan perubahan' : 'Simpan prospek';
  isiDatalistArea();
  openOv('#ovPas');
  setTimeout(() => (isSales || P('sales').value ? P('nama') : P('sales')).focus(), 30);
}

$('#pForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#pErr');
  const tampilErr = (m, el) => { err.textContent = m; err.classList.add('show'); if (el) el.focus(); };
  const kerja = P('kerja').value === '__lain' ? P('kerjaLain').value.trim() : P('kerja').value;
  const row = {
    id: PAS_ID, sales: P('sales').value, nama: P('nama').value.trim(), kontak: rapiKontak(P('kontak').value),
    provinsi: P('prov').value.trim(), kota: P('kota').value.trim(), kecamatan: P('kec').value.trim(), kelurahan: P('kel').value.trim(),
    pekerjaan: kerja, source: P('source').value, unit: P('unit').value, prospek: P('prospek').value,
    kategori: P('kategori').value, ket: P('ket').value.trim()
  };
  if (!row.sales) return tampilErr('Pilih nama sales.', P('sales'));
  if (!row.nama) return tampilErr('Nama prospek wajib diisi.', P('nama'));
  if (!/^08\d{8,11}$/.test(row.kontak)) return tampilErr('No. HP harus diawali 08 dan berisi 10–13 digit.', P('kontak'));
  if (!row.unit) return tampilErr('Pilih type mobil.', P('unit'));
  if (!row.prospek) return tampilErr('Pilih status prospek.', P('prospek'));
  if (!row.kategori) return tampilErr('Pilih kategori pembelian.', P('kategori'));
  if (P('kerja').value === '__lain' && !kerja) return tampilErr('Isi pekerjaan lainnya.', P('kerjaLain'));

  const b = $('#pSubmit'); b.disabled = true;
  try {
    load(await api('savePasLead', { row }));
    closeOv('#ovPas');
    toast(PAS_ID ? `Perubahan ${row.nama} disimpan` : `${row.nama} ditambahkan`);
  } catch (ex) { tampilErr(ex.message); }
  finally { b.disabled = false; }
});

// ===================== HAPUS =====================
let DEL_PT = 'SHN';
function openDel(id, pt = 'SHN') {
  const r = ROWS.find(x => x.id === id && x.pt === pt);
  if (!r) return;
  DEL_ID = id; DEL_PT = pt;
  $('#dText').innerHTML = `${pt === 'PAS' ? 'Prospek' : 'Lead'} <b>${esc(r.nama)}</b>${r.kontak ? ` (${esc(r.kontak)})` : ''} akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.`;
  openOv('#ovDel');
  setTimeout(() => $('#dOk').focus(), 30);
}
$('#dOk').addEventListener('click', async () => {
  const b = $('#dOk'); b.disabled = true;
  const nama = (ROWS.find(x => x.id === DEL_ID && x.pt === DEL_PT) || {}).nama || 'Lead';
  try { load(await api('delete', { id: DEL_ID, pt: DEL_PT })); closeOv('#ovDel'); toast(`${nama} dihapus`); }
  catch (e) { toast(e.message, true); }
  finally { b.disabled = false; }
});

// ===================== MODAL, TOAST, EVENT =====================
function openOv(s)  { $(s).classList.add('open'); }
function closeOv(s) { $(s).classList.remove('open'); }
document.querySelectorAll('.ov').forEach(ov => {
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeOv('#' + ov.id); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeOv('#' + ov.id)));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.ov.open').forEach(ov => closeOv('#' + ov.id));
});

let tt;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), bad ? 5000 : 2500);
}

// filter
$('#fbar').addEventListener('change', e => {
  const k = e.target.dataset.fl; if (!k) return;
  FL[k] = e.target.value;
  if (k === 'periode' && FL.periode !== 'custom') { FL.dari = ''; FL.sampai = ''; }
  simpanFL(); render();
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tg]');
  if (t && (t.closest('#fbar') || t.closest('#sum'))) { FL[t.dataset.tg] = !FL[t.dataset.tg]; simpanFL(); return render(); }
  if (e.target.closest('[data-rst]')) { FL = { ...FL_DEF }; simpanFL(); render(); }
});

$('#cmp').addEventListener('click', e => {
  const b = e.target.closest('.ct'); if (!b) return;
  CMP = b.dataset.c; BRAND = 'all'; FILTER = 'aktif';
  if (FL.who || FL.kota) { FL.who = ''; FL.kota = ''; simpanFL(); }   // nama SPV/sales & kota beda per perusahaan
  render();
});
$('#brands').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  BRAND = b.dataset.b; FILTER = 'aktif';
  render();
});
$('#pipe').addEventListener('click', e => {
  const b = e.target.closest('.seg'); if (!b) return;
  FILTER = (FILTER === b.dataset.f) ? 'aktif' : b.dataset.f;
  render();
});
$('#board').addEventListener('change', e => {
  const s = e.target.closest('select.qs'); if (!s) return;
  quickSave(s.closest('tr'), s.dataset.field, s.value);
});
$('#board').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const tr = b.closest('tr'), id = tr.dataset.id;
  if (b.dataset.act === 'log') return openLog(tr);
  if (b.dataset.act === 'ket') return editKet(b);
  if (b.dataset.act === 'edit') return tr.dataset.pt === 'PAS' ? openPas(id) : openForm(id);
  openDel(id, tr.dataset.pt);
});
$('#board').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.ket')) { e.preventDefault(); editKet(e.target); }
});

// ===================== EDIT KETERANGAN LANGSUNG DI TABEL =====================
// Klik → ketik → Enter / klik di luar = simpan, Shift+Enter = baris baru, Esc = batal
function editKet(div) {
  const tr = div.closest('tr');
  const r = rowOf(tr);
  if (!r) return;
  const td = div.parentElement;
  td.innerHTML = `<textarea class="ket-in" aria-label="Keterangan ${esc(r.nama)}"></textarea>
    <div class="ket-tip">Enter simpan, Esc batal</div>`;
  const ta = td.querySelector('textarea');
  ta.value = r.ket || '';
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);

  let selesai = false;
  const simpan = async () => {
    if (selesai) return; selesai = true;
    const val = ta.value.trim();
    if (val === String(r.ket || '').trim()) return render();
    if (r.pt === 'PAS') {
      tr.classList.add('saving');
      try { load(await api('savePas', { id: r.id, field: 'ket', value: val })); toast(`Keterangan ${r.nama} disimpan`); }
      catch (e) { render(); toast(e.message, true); }
      return;
    }
    await persist({ ...r, ket: val }, `Keterangan ${r.nama} disimpan`, tr);
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
    if (e.key === 'Escape') { e.stopPropagation(); selesai = true; render(); }
  });
  ta.addEventListener('blur', simpan);
}
let qt;
$('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { Q = e.target.value.trim(); render(); }, 150); });
$('#btnAdd').addEventListener('click', () => {
  const j = jenisTambah();
  if (j === 'PAS') return openPas();
  if (j === 'SHN') return openForm();
  if (j === 'PAS_KUNCI') return toast('Input prospek PAS baru dibuka setelah pindah dari AppSheet (fungsi pindahDariAppSheet).', true);
});
$('#btnOut').addEventListener('click', async () => {
  await SB.auth.signOut(); TOKEN = ''; MYID = '';
  ROWS = []; CMP = 'all'; BRAND = 'all'; render(); showGate('Anda sudah keluar dari HP ini.');
});
$('#btnReload').addEventListener('click', () => refresh('Data diperbarui'));

(async () => {
  const { data } = await SB.auth.getSession();
  if (data && data.session) { MYID = data.session.user.id; TOKEN = '1'; refresh(); }
  else showGate();
})();
</script>
